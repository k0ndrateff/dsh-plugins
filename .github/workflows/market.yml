# The market index is served by GitHub Pages from `docs/` on the default branch,
# so the committed file *is* the site. This workflow only checks that it still
# describes the packages: a version bumped without a `bun run market` would
# otherwise publish an index pointing at a release that does not exist.
#
# Pages must be set to "Deploy from a branch" → `main` / `docs` and nothing else;
# there is no deployment here to conflict with it.
name: market

on:
  push:
    branches: [main]
    paths:
      - "packages/**"
      - "scripts/market/**"
      - "docs/market.json"
      - ".github/workflows/market.yml"
  pull_request:
    paths:
      - "packages/**"
      - "scripts/market/**"
      - "docs/market.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # A publish time for a version the registry does not know yet comes from
          # the commit that wrote the package, so the check needs the history
          # rather than the tip.
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run market --check
