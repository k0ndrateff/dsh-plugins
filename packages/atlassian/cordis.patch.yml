# dsh-atlassian-plugin bundle layer.
#
# One row, mounted from the bare package name: the Client module system attaches
# a package's browser half (`./client`) to the Loader row whose specifier is the
# bare package name, so this row must not use a subpath export.
#
# Override or disable it from the profile patch with:
#   - id: atlassian
#     disabled: true
- insert:
    - id: atlassian
      name: dsh-atlassian-plugin
      config:
        # Atlassian's remote MCP resource. `/v1/mcp` needs no extra setup;
        # `/v2/mcp` is the newer generation with its own authorization server
        # and scope vocabulary (sign in again after switching — tokens are per
        # resource).
        endpoint: https://mcp.atlassian.com/v1/mcp
        # Loopback port for the OAuth redirect (http://127.0.0.1:<port>/callback).
        # The next free port is used when this one is taken.
        redirectPort: 8143
        # Set true to log the raw MCP payloads of every Atlassian tool result.
        debug: false
